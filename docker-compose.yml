services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-directindex}
      POSTGRES_USER: ${POSTGRES_USER:-directindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directindex_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-directindex} -d ${POSTGRES_DB:-directindex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://directindex:directindex_dev_password@db:5432/directindex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - data-cache:/app/.cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://directindex:directindex_dev_password@db:5432/directindex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - data-cache:/app/.cache
    command: celery -A app.tasks.celery_app worker --loglevel=INFO

  beat:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://directindex:directindex_dev_password@db:5432/directindex}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - data-cache:/app/.cache
    command: celery -A app.tasks.celery_app beat --loglevel=INFO

  ibkr-backend:
    build:
      context: ./backend/ibkr
    environment:
      # host.docker.internal resolves to the host machine on Docker Desktop (Mac/Windows).
      # On Linux set TWS_HOST to your machine's LAN IP or use the extra_hosts entry below.
      TWS_HOST: ${TWS_HOST:-host.docker.internal}
      TWS_PORT: ${TWS_PORT:-7496}
      TWS_CLIENT_ID: ${TWS_CLIENT_ID:-1}
      SCAN_BATCH_SIZE: ${SCAN_BATCH_SIZE:-5}
      OPTIONS_CACHE_TTL: ${OPTIONS_CACHE_TTL:-300}
      QUOTE_CACHE_TTL: ${QUOTE_CACHE_TTL:-5}
    ports:
      - "8002:8002"
    volumes:
      - ./backend/ibkr:/app
      - /app/.venv                        # keep container venv separate from host venv
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux compatibility
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_IBKR_API_URL: ${NEXT_PUBLIC_IBKR_API_URL:-http://localhost:8002}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ibkr-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  postgres-data:
  redis-data:
  data-cache:

